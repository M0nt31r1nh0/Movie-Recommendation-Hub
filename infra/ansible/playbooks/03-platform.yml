# Cluster-wide pieces the application relies on, installed once:
#   - the volumes (k8s/platform/storage.yaml.j2): one folder per PersistentVolumeClaim (databases, Kafka,
#     Ollama's models, Prometheus, Grafana) on a worker's data disk, which outlives the VMs;
#   - Strimzi: the operator that runs Kafka from a Kafka resource (k8s/kafka.yaml.j2);
#   - kube-prometheus-stack: Prometheus, Grafana, node-exporter and kube-state-metrics, plus the
#     ServiceMonitor/PodMonitor resources the application uses to say what to scrape.
- name: Create the volumes' folders on the data disks
  hosts: workers
  become: true
  gather_facts: false
  tasks:
    - name: Check that every volume is on an existing worker
      ansible.builtin.assert:
        that: persistent_volumes | map(attribute='node') | difference(groups['workers']) | length == 0
        fail_msg: "persistent_volumes names a node that isn't a worker ({{ groups['workers'] | join(', ') }})."
      run_once: true

    # Open to every user, as local-path-provisioner made them: PostgreSQL, Kafka and Prometheus run as
    # different users, and each one makes its own subfolder with its own permissions. A folder that is
    # already there keeps what's in it.
    # Grafana keeps the admin password it was created with: a new one from a lost .secrets folder
    # wouldn't let anyone in.
    - name: Look for Grafana's database on its data disk
      ansible.builtin.stat:
        path: "{{ data_dir }}/monitoring/monitoring-grafana/grafana.db"
      register: grafana_db
      when: inventory_hostname == (persistent_volumes | selectattr('claim', 'eq', 'monitoring-grafana') | first).node

    - name: If there is one, look for its admin password in {{ secrets_dir }}
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ secrets_dir }}/grafana-admin"
      register: grafana_secret
      when: grafana_db.stat.exists | default(false)

    - name: Check that it isn't missing
      ansible.builtin.assert:
        that: grafana_secret.stat.exists
        fail_msg: >-
          The data disk holds Grafana's database, created with an admin password that is no longer in
          {{ secrets_dir }}/grafana-admin. Put back that folder from the deployment that created it.
      when: grafana_db.stat.exists | default(false)

    - name: Create {{ data_dir }}/<namespace>/<claim> for this worker's volumes
      ansible.builtin.file:
        path: "{{ data_dir }}/{{ item.namespace }}/{{ item.claim }}"
        state: directory
        mode: "0777"
      loop: "{{ persistent_volumes | selectattr('node', 'eq', inventory_hostname) }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.claim }}"

- name: Install the platform
  hosts: controlplane
  vars:
    workdir: "/home/{{ ansible_user }}/platform"
  tasks:
    - name: Download Helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
        creates: /tmp/linux-amd64/helm

    - name: Install Helm
      become: true
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        mode: "0755"

    - name: Create {{ workdir }}
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0755"

    - name: Write the volumes
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../k8s/platform/storage.yaml.j2"
        dest: "{{ workdir }}/storage.yaml"
        mode: "0600"

    # Before anything that claims one: each claim waits for its volume.
    - name: Create the StorageClass and the volumes
      ansible.builtin.command: kubectl apply -f {{ workdir }}/storage.yaml

    - name: Install Strimzi (watches the kafka namespace)
      ansible.builtin.command: >
        helm upgrade --install strimzi oci://quay.io/strimzi-helm/strimzi-kafka-operator
        --version {{ strimzi_version }} --namespace kafka --create-namespace --wait --timeout 10m

    - name: Write kube-prometheus-stack's settings
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../k8s/platform/kube-prometheus-stack.values.yaml.j2"
        dest: "{{ workdir }}/kube-prometheus-stack.values.yaml"
        mode: "0600"

    - name: Add the prometheus-community chart repository
      ansible.builtin.command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update

    - name: Install kube-prometheus-stack
      ansible.builtin.command: >
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack
        --version {{ kube_prometheus_stack_version }} --namespace monitoring --create-namespace
        --values {{ workdir }}/kube-prometheus-stack.values.yaml --wait --timeout 15m
