quarkus.datasource.db-kind=postgresql

# recommendation-service has its own database instance (recommendations-db in infra/compose.yaml),
# which no other service accesses. Flyway owns the schema; Hibernate only checks it (dev and test).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=recommendations
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file

# Dev runs next to movies-service (8080) and profiles-service (8081).
%dev.quarkus.http.port=8082
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/recommendations
%dev.quarkus.datasource.username=recommendations
%dev.quarkus.datasource.password=recommendations
%dev.quarkus.hibernate-orm.schema-management.strategy=validate

# Users' Keycloak access tokens, issued for this API ("recommendation-service" in their audience).
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=recommendation-service
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/movies

# Calls to profiles-service's internal endpoints and to movies-service are made as this service's own
# Keycloak service account: client recommendation-service, with a secret (RECOMMENDATION_SERVICE_SECRET).
quarkus.oidc-client.auth-server-url=${KEYCLOAK_REALM_URL:http://localhost:8180/realms/movies}
quarkus.oidc-client.client-id=recommendation-service
quarkus.oidc-client.credentials.secret=${RECOMMENDATION_SERVICE_SECRET:recommendation-service-dev-secret}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false
%dev.quarkus.rest-client.profiles-api.url=http://localhost:8081
%dev.quarkus.rest-client.movies-api.url=http://localhost:8080

# Kafka (the broker from infra/compose.yaml; KAFKA_BOOTSTRAP_SERVERS elsewhere).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Jobs for recommendation-worker, keyed by user id.
mp.messaging.outgoing.recommendation-requests.connector=smallrye-kafka
mp.messaging.outgoing.recommendation-requests.topic=recommendation.requests
# The worker's results: all copies of this service share one group, so each result is stored once.
mp.messaging.incoming.recommendation-results.connector=smallrye-kafka
mp.messaging.incoming.recommendation-results.topic=recommendation.results
mp.messaging.incoming.recommendation-results.group.id=recommendation-service
mp.messaging.incoming.recommendation-results.auto.offset.reset=earliest
# "A result is stored": every copy reads it, each in its own group (a random id per start), to notify
# the users connected to it. Only new events matter, since connections don't survive a restart.
mp.messaging.outgoing.recommendation-ready.connector=smallrye-kafka
mp.messaging.outgoing.recommendation-ready.topic=recommendation.ready
mp.messaging.incoming.recommendation-ready-in.connector=smallrye-kafka
mp.messaging.incoming.recommendation-ready-in.topic=recommendation.ready
mp.messaging.incoming.recommendation-ready-in.group.id=recommendation-service-${quarkus.uuid}
mp.messaging.incoming.recommendation-ready-in.auto.offset.reset=latest

# Background agent (see BackgroundAgent): how often it compares profiles' fingerprints with their
# current recommendations, and makes new ones for those whose own inputs, or what the people they
# follow watched, changed.
recommendation.agent.every=10m
recommendation.agent.delay=30s
# After the user changes their own profile, wait until it stops changing for this long.
recommendation.agent.settle=PT2M
# At most this many new jobs per run, so a burst of changes doesn't bury users' Ask AI requests.
recommendation.agent.max-per-run=20
# After a failure, wait this long before retrying, doubling each time up to the longest.
recommendation.retry.first=PT30M
recommendation.retry.longest=PT6H
# A request still PENDING after this fails: a safety net for a job lost from Kafka. It counts the time
# spent waiting in the queue, so on a slow CPU keep it well above a few jobs' time.
recommendation.timeout=PT1H
# Failed typed requests are kept this long, outside the history, so a returning user is told.
recommendation.failed.keep-for=PT1H
recommendation.sse.heartbeat=20s

# The frontend calls the API from the browser, from another origin (CORS).
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000

# "Authorize" in the Swagger UI logs in through Keycloak (see LoginFlowOpenApiFilter).
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=keycloak
quarkus.smallrye-openapi.oidc-open-id-connect-url=${quarkus.oidc.auth-server-url:http://localhost:8180/realms/movies}/.well-known/openid-configuration
quarkus.swagger-ui.oauth-client-id=movies-swagger-ui
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true

# Prod reads locations and secrets from the environment:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
#   QUARKUS_OIDC_AUTH_SERVER_URL and KEYCLOAK_REALM_URL, e.g. https://auth.example.com/realms/movies
#   RECOMMENDATION_SERVICE_SECRET, KAFKA_BOOTSTRAP_SERVERS
#   QUARKUS_REST_CLIENT_PROFILES_API_URL, QUARKUS_REST_CLIENT_MOVIES_API_URL, QUARKUS_HTTP_CORS_ORIGINS

# Tests: a throwaway Dev Services database, in-memory channels instead of Kafka (see InMemoryKafka),
# mocked profiles and movies APIs, and @TestSecurity instead of Keycloak. The scheduled jobs don't run
# on their own; tests call them.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.http.test-port=0
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc-client.client-enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.rest-client.profiles-api.url=http://localhost:1
%test.quarkus.rest-client.movies-api.url=http://localhost:1
