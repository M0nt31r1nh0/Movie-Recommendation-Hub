# recommendation-worker: takes recommendation jobs from Kafka, asks Ollama, and publishes the results.
# It has no API; its port only serves health checks (/q/health).
quarkus.http.port=8083

# Kafka (the broker from infra/compose.yaml; KAFKA_BOOTSTRAP_SERVERS elsewhere).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.recommendation-requests.connector=smallrye-kafka
mp.messaging.incoming.recommendation-requests.topic=recommendation.requests
# All workers share one consumer group, so each job goes to exactly one of them.
mp.messaging.incoming.recommendation-requests.group.id=recommendation-worker
mp.messaging.incoming.recommendation-requests.auto.offset.reset=earliest
# Fetch one job at a time; a model can take minutes on one, which Kafka must not treat as a stuck
# consumer (the default limit is 60 s).
mp.messaging.incoming.recommendation-requests.max.poll.records=1
mp.messaging.incoming.recommendation-requests.throttled.unprocessed-record-max-age.ms=1800000
# The same on the worker thread, so Vert.x doesn't log a "blocked thread" warning every few seconds.
quarkus.vertx.max-worker-execute-time=30M
mp.messaging.outgoing.recommendation-results.connector=smallrye-kafka
mp.messaging.outgoing.recommendation-results.topic=recommendation.results

# Ollama (QUARKUS_REST_CLIENT_OLLAMA_URL elsewhere). A model can take minutes on a slow CPU.
quarkus.rest-client.ollama.url=http://localhost:11434
quarkus.rest-client.ollama.read-timeout=900000

# The chat model, from https://ollama.com/library; download it with 'ollama pull' first (infra/compose.yaml
# does, see OLLAMA_MODEL). Smaller models are faster but choose less well.
recommendation.model=${RECOMMENDATION_MODEL:qwen2.5:3b}
# How many candidates the model chooses from, and how much of each description it reads: the prompt,
# and so the time per recommendation, grows with both.
recommendation.candidates=${RECOMMENDATION_CANDIDATES:30}
# Plus up to this many movies the people the user follows watched, if they pass the same filters.
recommendation.friend-candidates=${RECOMMENDATION_FRIEND_CANDIDATES:20}
recommendation.description-chars=160
recommendation.temperature=0.4
# Room for the prompt (up to 50 candidates, about 3,500 tokens) and the answer.
recommendation.context-tokens=8192
# How long Ollama keeps the model in memory after a request (reloading it takes a few seconds).
recommendation.keep-alive=10m

# movies-service (QUARKUS_REST_CLIENT_MOVIES_API_URL elsewhere), called as the worker's own Keycloak
# service account: client recommendation-worker, with a secret (RECOMMENDATION_WORKER_SECRET).
quarkus.rest-client.movies-api.url=http://localhost:8080
# For a typed request, movies-service first embeds it (search by meaning), which on a slow CPU can wait
# behind the movies it's embedding.
quarkus.rest-client.movies-api.read-timeout=300000
quarkus.oidc-client.auth-server-url=${KEYCLOAK_REALM_URL:http://localhost:8180/realms/movies}
quarkus.oidc-client.client-id=recommendation-worker
quarkus.oidc-client.credentials.secret=${RECOMMENDATION_WORKER_SECRET:recommendation-worker-dev-secret}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

# Tests replace Kafka with in-memory channels (see InMemoryKafka), and mock Ollama and movies-service.
%test.quarkus.http.test-port=0
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.oidc-client.client-enabled=false
