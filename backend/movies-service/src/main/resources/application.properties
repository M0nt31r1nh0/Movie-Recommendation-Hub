quarkus.datasource.db-kind=postgresql

# The movies database is created and loaded outside this service (see data/schema.sql),
# so Hibernate must never create, alter or drop anything there: dev only validates the
# mapping against the existing tables, prod does nothing.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file

# Dev connects to the local PostgreSQL from compose.yaml.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/movies
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.hibernate-orm.schema-management.strategy=validate

# Prod reads the connection from the environment:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD

# Tests run against a throwaway Dev Services container (no JDBC URL is set for %test),
# so rebuilding the schema and loading sample data is safe there and only there.
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.create-schemas=true
%test.quarkus.hibernate-orm.sql-load-script=import.sql
