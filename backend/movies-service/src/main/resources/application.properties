quarkus.datasource.db-kind=postgresql

# Flyway owns the schema: at startup it applies the scripts in db/migration that the
# database hasn't run yet. They only ever add to the schema; none of them drops anything.
# A database restored from data/movies_dump.sql already has the base schema, so Flyway
# records it as version 1 (baseline) and applies only V2 onwards.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=movies
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# Hibernate never creates, alters or drops anything: dev and test only check that the
# entities match the schema Flyway built, prod does nothing.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file

# Dev connects to the local PostgreSQL from infra/compose.yaml.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/movies
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.hibernate-orm.schema-management.strategy=validate

# Authentication: the API accepts Keycloak access tokens (Authorization: Bearer ...) and
# never logs users in itself. Tokens must be issued for this API, i.e. carry "movies-service"
# in their audience; the realm's clients add it (infra/keycloak/movies-realm.json).
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=movies-service
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/movies

# The OpenAPI document and Swagger UI describe that login, so "Authorize" in the Swagger UI
# logs in through Keycloak (and can register a new account) before trying the endpoints.
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=keycloak
quarkus.smallrye-openapi.oidc-open-id-connect-url=${quarkus.oidc.auth-server-url:http://localhost:8180/realms/movies}/.well-known/openid-configuration
quarkus.swagger-ui.oauth-client-id=movies-swagger-ui
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true

# The frontend is served from another origin and calls the API from the browser, so it must be
# allowed explicitly (CORS). Only the listed origins may; the default allows none.
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000

# Prod reads the database, Keycloak and frontend locations from the environment:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
#   QUARKUS_OIDC_AUTH_SERVER_URL, e.g. https://auth.example.com/realms/movies
#   QUARKUS_HTTP_CORS_ORIGINS, e.g. https://movies.example.com

# Tests run against a throwaway Dev Services container (no JDBC URL is set for %test):
# Flyway builds the schema from V1 and loads the sample movies from db/testdata.
%test.quarkus.flyway.locations=db/migration,db/testdata
%test.quarkus.hibernate-orm.schema-management.strategy=validate
# A random port, so tests don't clash with a running dev server (profiles-service uses 8081 in dev).
%test.quarkus.http.test-port=0

# Tests don't talk to Keycloak: they use @TestSecurity to act as a logged-in user.
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
