quarkus.datasource.db-kind=postgresql

# profiles-service has its own database instance (profiles-db in infra/compose.yaml), which no other
# service accesses. It knows movies and genres only by id, and asks movies-service's API about them.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=profiles

# Hibernate never creates, alters or drops anything: dev and test only check that the entities match
# the schema, prod does nothing.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file

# Dev runs next to movies-service (8080) and connects to profiles-db from infra/compose.yaml.
%dev.quarkus.http.port=8081
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/profiles
%dev.quarkus.datasource.username=profiles
%dev.quarkus.datasource.password=profiles
%dev.quarkus.hibernate-orm.schema-management.strategy=validate

# movies-service's API (see MoviesClient), called with the logged-in user's token.
%dev.quarkus.rest-client.movies-api.url=http://localhost:8080
quarkus.rest-client.movies-api.connect-timeout=2000
quarkus.rest-client.movies-api.read-timeout=5000
# The 20 genres rarely change: ask movies-service for them at most every 10 minutes.
quarkus.cache.caffeine.genres.expire-after-write=10M

# Authentication: the API accepts Keycloak access tokens (Authorization: Bearer ...) issued for it,
# i.e. carrying "profiles-service" in their audience; the realm's clients add it
# (infra/keycloak/movies-realm.json).
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=profiles-service
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/movies

# The frontend calls the API from the browser, from another origin (CORS).
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000

# "Authorize" in the Swagger UI logs in through Keycloak before trying the endpoints.
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=keycloak
quarkus.smallrye-openapi.oidc-open-id-connect-url=${quarkus.oidc.auth-server-url:http://localhost:8180/realms/movies}/.well-known/openid-configuration
quarkus.swagger-ui.oauth-client-id=movies-swagger-ui
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true

# Prod reads the database, movies API, Keycloak and frontend locations from the environment:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
#   QUARKUS_REST_CLIENT_MOVIES_API_URL, e.g. http://movies-service:8080
#   QUARKUS_OIDC_AUTH_SERVER_URL, e.g. https://auth.example.com/realms/movies
#   QUARKUS_HTTP_CORS_ORIGINS, e.g. https://movies.example.com

# Tests run against a throwaway Dev Services container (no JDBC URL is set for %test), with sample
# profiles from db/testdata, and replace movies-service's API with a mock (see ProfileResourceTest).
# They use a random port so they don't clash with a running dev server, and act as users with
# @TestSecurity instead of Keycloak.
%test.quarkus.rest-client.movies-api.url=http://localhost:1
%test.quarkus.flyway.locations=db/migration,db/testdata
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.http.test-port=0
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
