# The website, built from frontend/Dockerfile. It calls nothing itself: your browser calls the APIs (see the
# build args), so it doesn't need to join the other services' network. `just local-up` (in the project root)
# starts it last, after the infrastructure and the backend.

services:
  frontend:
    build:
      context: .
      # NEXT_PUBLIC_* values are compiled into the browser code, so they are the addresses your browser
      # uses (localhost and the published ports), not container names. The Dockerfile's defaults (/api,
      # /auth) are for the NGINX of the Kubernetes deployment and stay as they are.
      args:
        NEXT_PUBLIC_MOVIES_API_URL: http://localhost:8080
        NEXT_PUBLIC_PROFILES_API_URL: http://localhost:8081
        NEXT_PUBLIC_RECOMMENDATIONS_API_URL: http://localhost:8082
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8180
    container_name: frontend
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "3000:3000"
    healthcheck:
      # The image has no curl, but it has node. 127.0.0.1 (not localhost): the server listens on IPv4 only.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
